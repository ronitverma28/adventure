# ============================================================
# ADVENTURE PLATFORM - application.properties
# Converted from application.yml  (use ONE file, not both)
# Delete this file if you keep application.yml
# ============================================================

spring.application.name=adventure-backend

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adventure_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ronit123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Mail ─────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:ronitroy22678@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xmam zwyu qgef fupy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Cache ────────────────────────────────────────────────────
spring.cache.type=simple

# ── File Upload ──────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── Server ───────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:YWR2ZW50dXJlLXBsYXRmb3JtLWRldi1zZWNyZXQta2V5LW1pbmltdW0tMjU2LWJpdHMtbG9uZy1kby1ub3QtdXNlLWluLXByb2Q=}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXP:604800000}

# ── Cloudinary ───────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dev-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:dev-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dev-api-secret}
cloudinary.folder=adventure

# ── Razorpay ─────────────────────────────────────────────────
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_local_dev}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:dev-razorpay-secret}
razorpay.currency=INR

# ── Stripe ───────────────────────────────────────────────────
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_local_dev}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_local_dev}

# ── App Config ───────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.support-email=${SUPPORT_EMAIL:support@adventure.com}
app.name=Adventure Platform
app.tax-rate=0.18

# ── Logging ──────────────────────────────────────────────────
logging.level.com.adventure=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── SpringDoc / Swagger ──────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
